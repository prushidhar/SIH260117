<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDRA — Sovereign AI Workbench</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080c14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 480px;
      text-align: center;
      padding: 32px;
    }
    .logo-box {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      animation: spin 1.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }
    .logo-icon svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 0.05em;
      margin-bottom: 32px;
      text-transform: uppercase;
      font-weight: 500;
    }
    .progress-bar-container {
      width: 280px;
      height: 3px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }
    .progress-bar {
      position: absolute;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #818cf8);
      border-radius: 999px;
      animation: slide 1.5s ease-in-out infinite;
    }
    @keyframes slide {
      0% { left: -50%; width: 30%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 30%; }
    }
    .status-text {
      font-size: 12px;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .badge {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <div class="logo-ring"></div>
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <h1>INDRA SOVEREIGN WORKBENCH</h1>
    <div class="subtitle">Industrial Neural Decision & Reasoning Assistant</div>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
    <div class="status-text" id="status">Starting on-premise neural engine & services...</div>
    <div class="badge">
      <span class="dot"></span>
      100% AIR-GAPPED &bull; LOCAL QUANTIZED INFERENCE
    </div>
  </div>
</body>
</html>
