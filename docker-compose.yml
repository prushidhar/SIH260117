version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sovereign_backend
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - "D:/models:/models" # Mount local models to container
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - airgap_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sovereign_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - airgap_network

networks:
  airgap_network:
    driver: bridge
    # internal: true  # Uncommenting this completely physically blocks the docker network from the host's internet
